[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0.104"
async-channel = "2.3.1"
serde_json = "1.0.104"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.12"
futures-util = "0.3.31"
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10.9"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
noema-config = { path = "crates/noema-config" }
jobctl = { path = "crates/jobctl"}

