[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[dependencies]
client = { version = "0.1.0", path = "../client" }
jobctl = { version = "0.1.0", path = "../jobctl" }
gpui-kit = "0.7.0"
anyhow = { workspace = true }
serde_json = {workspace = true}
noema-config = { workspace = true }

[features]
# Opens the create-skill wizard directly against a stubbed jobctl engine
# (no login, no LLM): `cargo run -p ui --release --features stub-jobs`.
stub-jobs = []

[dev-dependencies]
gpui-kit = { version = "0.7.0", features = ["test-support"] }
