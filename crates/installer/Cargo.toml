[package]
name = "installer"
version = "0.1.0"
edition = "2024"
description = "Noema toolchain bootstrapper: installs a managed Rust, Rumoca and Pixi toolchain for Noema"

[[bin]]
name = "noema-setup"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
dirs = "6.0.0"
ureq = "3"

[dev-dependencies]
tempfile = "3"