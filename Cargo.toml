[workspace]
resolver = "2"
members = ["crates/*"]
# The installer bootstraps machines; it is deliberately a standalone
# workspace so it builds without the other crates' external path
# dependencies (and inside minimal containers). See crates/installer.
# reloaded-code is a vendored upstream workspace (see VENDORED.md).
exclude = ["crates/installer", "crates/reloaded-code"]

[workspace.dependencies]
anyhow = "1.0.104"
async-channel = "2.3.1"
serde_json = "1.0.104"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.12"
futures-util = "0.3.31"
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10.9"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
noema-config = { path = "crates/noema-config" }
smap = { path = "crates/smap" }
permanence = { path = "crates/permanence" }
jobctl = { path = "crates/jobctl"}
nanoid = "0.5.0"

# Faster optimized iteration profile: thin LTO and parallel codegen compile
# much faster than the fat-LTO release profile.
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

