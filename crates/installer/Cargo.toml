[package]
name = "installer"
version = "0.1.0"
edition = "2024"
description = "Noema toolchain bootstrapper: installs a managed Rust, Rumoca and Pixi toolchain for Noema"

# Standalone workspace: the bootstrapper must build on a bare machine,
# independent of the main noema workspace and its external path deps.
[workspace]

[[bin]]
name = "noema-setup"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.104"
sha2 = "0.10.9"
dirs = "6.0.0"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"